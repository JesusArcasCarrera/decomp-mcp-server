[project]
name = "decomp-mcp-server"
version = "0.1.0"
description = "MCP server + Firefox extension bridge for decomp.me decompilation automation"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "websockets>=13.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decomp_mcp"]

[tool.uv]
dev-dependencies = []
